<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="12" fill="#f0fdf4"/>
  <!-- Face outline -->
  <ellipse cx="200" cy="200" rx="100" ry="130" fill="#fde8d8" stroke="#d4a373" stroke-width="2"/>
  <!-- Hair -->
  <path d="M100 160 Q120 80 200 70 Q280 80 300 160" fill="#4a3728" stroke="none"/>
  <!-- Eyes -->
  <ellipse cx="165" cy="185" rx="15" ry="10" fill="white" stroke="#4a3728" stroke-width="1.5"/>
  <ellipse cx="235" cy="185" rx="15" ry="10" fill="white" stroke="#4a3728" stroke-width="1.5"/>
  <circle cx="165" cy="187" r="6" fill="#4a3728"/>
  <circle cx="235" cy="187" r="6" fill="#4a3728"/>
  <!-- Nose -->
  <path d="M195 210 Q200 230 205 210" stroke="#d4a373" stroke-width="1.5" fill="none"/>
  <!-- Lips -->
  <path d="M175 260 Q200 270 225 260" stroke="#e57373" stroke-width="2" fill="#f8a4a4" opacity="0.5"/>
  <!-- Electrolysis probe on chin -->
  <line x1="210" y1="290" x2="240" y2="330" stroke="#4a4a5a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="210" cy="290" r="2" fill="#2c6e49"/>
  <!-- Probe tip glow -->
  <circle cx="210" cy="290" r="6" fill="#2c6e49" opacity="0.2"/>
  <circle cx="210" cy="290" r="10" fill="#2c6e49" opacity="0.1"/>
  <!-- Treatment area indicator (upper lip) -->
  <rect x="178" y="240" width="44" height="18" rx="4" fill="none" stroke="#2c6e49" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Treatment area indicator (chin) -->
  <rect x="175" y="275" width="50" height="30" rx="4" fill="none" stroke="#2c6e49" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Label -->
  <text x="260" y="300" font-family="sans-serif" font-size="11" fill="#2c6e49" font-weight="bold">Treatment</text>
  <text x="260" y="315" font-family="sans-serif" font-size="11" fill="#2c6e49" font-weight="bold">Areas</text>
  <!-- Small hairs being treated -->
  <line x1="190" y1="280" x2="190" y2="275" stroke="#6b7280" stroke-width="0.8"/>
  <line x1="195" y1="282" x2="195" y2="277" stroke="#6b7280" stroke-width="0.8"/>
  <line x1="200" y1="285" x2="200" y2="280" stroke="#6b7280" stroke-width="0.8"/>
  <line x1="205" y1="283" x2="205" y2="278" stroke="#6b7280" stroke-width="0.8"/>
</svg>
